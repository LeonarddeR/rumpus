[package]
name = "rumpus"
description = "Accessible MIDI file player for Windows MIDI Services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
live-region = "0.3"
rumpus-core = { path = "../rumpus-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
windows-collections = "0.100"
windows-core = "0.100"
windows-future = "0.100"
wx-utils = "0.3"
wxdragon = "0.9.21"

[build-dependencies]
embed-manifest = "1.5"
winresource = "0.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
uiautomation = "0.25"

[package.metadata.release]
# cargo-release accepts a single hook command; cmd /c chains the checks. The last one drives the
# real GUI through UI Automation, so it takes over the desktop until it finishes.
pre-release-hook = [
	"cmd",
	"/c",
	"cargo fmt --all -- --check && cargo clippy -p rumpus-core -p xtask --all-targets -- -D warnings && cargo test -p rumpus-core -p xtask && cargo test -p rumpus -- --ignored",
]
# The file path resolves against this crate's directory.
pre-release-replacements = [
	{ file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
